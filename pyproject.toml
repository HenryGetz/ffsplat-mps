[project]
name = "ffsplat"
version = "0.1"
description = "A conversion tool for splatting scenes."
authors = [{ name = "Wieland Morgenstern", email = "wieland.morgenstern@hhi.fraunhofer.de" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Apple-Silicon (MPS/Metal) port of gsplat; vendored (see vendor/mpsplat/VENDOR.md).
    # It ships the upstream top-level package name, so `import gsplat` still works.
    "mpsplat==1.5.3",
    # Bumped from 2.6.0: the vendored mpsplat Metal kernels need
    # `torch.mps.compile_shader`, which did not exist in 2.6.0 (see PROGRESS.md).
    "torch==2.14.1",
    "jaxtyping>=0.2.25,<0.3.0",
    "numpy>=2.0.0,<3.0.0",
    "plyfile>=1.1.0,<2.0.0",
    # "hydra-core>=1.3.0,<2.0.0",
    "jsonargparse>=4.37.0,<5.0.0",
    # TODO imagecodecs version > 2023.9.18 produce much larger JPEG XL files: https://github.com/fraunhoferhhi/Self-Organizing-Gaussians/issues/3
    # but for numpy > 2, we require a modern imagecodecs
    #"imagecodecs[all]>=2024.12.30",
    "PyYAML>=6.0.2,<7.0.0",
    "opencv-python>=4.11.0.86,<5.0.0.0",
    "pillow>=11.1.0,<12.0.0",
    "pillow-heif>=0.22.0,<1.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "torchvision>=0.21.0,<1.0.0",
    "torchmetrics>=1.6.1,<2.0.0",
    "camorph @ git+https://github.com/Fraunhofer-IIS/camorph@2c95c8b15b0532d6280091761a9b51ab65cd2f98",
    "plas @ git+https://github.com/fraunhoferhhi/PLAS.git@4f1109c94f29a5a6de62bdf8f20cb3ce1ff0e680",
    "viser @ git+https://github.com/w-m/viser.git@03b87b8c1521a0afe79d885e684f1cb0b3323294",
]

[tool.uv.sources]
# Wire the vendored MPS port in as the `gsplat` provider. Editable so the 14
# .metal shader sources are read from vendor/mpsplat (upstream MANIFEST.in does not
# list them, so a built wheel could omit them).
mpsplat = { path = "vendor/mpsplat", editable = true }

[tool.uv]
# PLAS (github.com/fraunhoferhhi/PLAS) lists `lapjv` in install_requires, but its
# runtime package (`plas/core.py`, `plas/vad.py`) imports only numpy/torch/kornia/tqdm.
# `lapjv` is used solely by PLAS's upstream evaluation script `eval/flas.py`, which
# ffsplat never imports. lapjv's own setup.py has no Darwin branch
# ("not supported anymore due to M1, PRs welcome"), so every published version fails
# to build on this Apple-Silicon host. Drop it on macOS only; Linux/CUDA is unaffected.
override-dependencies = ["lapjv; sys_platform != 'darwin'"]

[project.urls]
Homepage = "https://w-m.github.io/ffsplat/"
Repository = "https://github.com/w-m/ffsplat"
Documentation = "https://w-m.github.io/ffsplat/"

[project.scripts]
ffsplat-convert = "ffsplat.cli.convert:main"
ffsplat-view = "ffsplat.cli.view:main"
# ffsplat-probe = "ffsplat.cli.probe:main"
ffsplat-live = "ffsplat.cli.live:main"
ffsplat-eval = "ffsplat.cli.eval:main"
# Unified entry point that dispatches to the sub-commands above.
ffsplat = "ffsplat.cli.__main__:main"
# ffsplat-opt = "ffsplat.cli.opt:main"


[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.22.0",
    "mypy>=0.991",

    "ruff>=0.9.2",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "types-pyyaml>=6.0.12.20250326",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"ffsplat.conf.decoding_templates" = ["*.yaml"]
"ffsplat.conf.format" = ["*.yaml"]

[tool.mypy]
files = ["src"]
exclude = ["src/ffsplat/render/.*", "src/ffsplat/io/.*", "src/ffsplat/cli/.*", "src/ffsplat/models_v0/.*", "src/ffsplat/datasets/.*"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["gsplat.*", "plyfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# vendor/ is a byte-for-byte copy of an upstream project (see vendor/mpsplat/VENDOR.md);
# reformatting or linting it would break the pinned-copy guarantee.
extend-exclude = ["vendor"]
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Syntax error in forward annotation, required for jaxtyping (https://docs.kidger.site/jaxtyping/faq/)
    "F722",
    # Checks for long exception messages that are not defined in the exception class itself, doesn't allow `ValueError("message")`
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/ffsplat/models/transformations.py"=["C901"]

[tool.ruff.format]
preview = true

[tool.deptry]
# Same reasoning as ruff.extend-exclude: the vendored upstream tree is not ours to lint.
# (`extend_exclude`, not `exclude`: the latter would replace deptry's own defaults,
# e.g. it would start scanning .venv.)
extend_exclude = ["vendor"]

[tool.deptry.per_rule_ignores]
# torchvision is required for torchmetrics
DEP002 = ["torchvision"]
